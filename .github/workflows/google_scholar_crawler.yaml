name: Sync Google Scholar publications

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: google-scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch publications
        run: python google_scholar_crawler/main.py
        env:
          GOOGLE_SCHOLAR_ID: wdxoBcUAAAAJ
      - name: Commit updated data
        run: |
          if git diff --quiet -- _data/scholar.json; then
            echo "Scholar data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.json
          git commit -m "chore: sync Google Scholar publications"
          git push
